name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release')"

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: version
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Commit and push version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }} --follow-tags

      - name: Build and publish
        run: npm run dist:win:ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify latest.yml on release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            if node -e "
              const repo = process.env.GITHUB_REPOSITORY;
              const version = process.env.VERSION;
              const token = process.env.GH_TOKEN;
              const headers = { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28' };
              (async () => {
                const res = await fetch('https://api.github.com/repos/' + repo + '/releases?per_page=100', { headers });
                if (!res.ok) process.exit(1);
                const releases = await res.json();
                const release = releases.find(r => r.tag_name === 'v' + version);
                if (!release) process.exit(1);
                const hasLatestYml = (release.assets || []).some(a => a.name === 'latest.yml');
                process.exit(hasLatestYml ? 0 : 1);
              })().catch(() => process.exit(1));
            "; then
              echo "Updater metadata OK for v${VERSION}"
              exit 0
            fi
            echo "Retry $i: release asset not ready yet..."
            sleep 15
          done
          echo "latest.yml missing or invalid for v${VERSION}"
          exit 1
